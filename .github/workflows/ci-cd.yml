
name: CI & CD

on:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint code
        run: flake8 .

      - name: Run tests (Django+SQLite)
        env:
          SECRET_KEY: testsecret
          DEBUG: "True"
          ALLOWED_HOSTS: 127.0.0.1,localhost
          USE_SQLITE: "1"
          DB_NAME: db.sqlite3
        run: python manage.py test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Compose .env
        run: |
          echo "DB_NAME=mailsender" > .env
          echo "DB_USER=adminuser" >> .env
          echo "DB_PASSWORD=1234" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "SECRET_KEY=django-insecure-\$bw=7gen2)905)psvun\$4wh1em0fx(xbcx6pvi6j^a9_74o+cc" >> .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
          echo "REDIS_URL=redis://redis:6379/0" >> .env

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build Docker images
        run: docker-compose build

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - uses: actions/checkout@v3

      - name: Prepare .env for production
        run: |
          echo "${{ secrets.ENV_PROD_FILE }}" > .env

      - name: Copy project files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/home/${{ secrets.USERNAME }}/mailsender/"

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/mailsender/
            docker-compose down
            docker-compose pull
            docker-compose up -d --build
            sleep 5
            docker-compose exec -T backend python manage.py migrate
            docker-compose exec -T backend python manage.py collectstatic --noinput
