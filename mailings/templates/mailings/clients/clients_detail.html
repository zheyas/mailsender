{% extends "mailings/base.html" %}
{% block title %}Карточка клиента{% endblock %}
{% block content %}
<h2 class="mb-3">Информация о клиенте</h2>
<div class="card shadow-sm">
    <div class="card-body">
        <h4 class="card-title"><i class="bi bi-person"></i> {{ object.full_name }}</h4>
        <p class="card-text mb-1"><strong>Email:</strong> {{ object.email }}</p>
        <p class="card-text"><strong>Комментарий:</strong> {{ object.comment|linebreaksbr }}</p>
        <div class="mt-3">
            <a href="{% url 'mailings:clients_update' object.pk %}" class="btn btn-primary"><i class="bi bi-pencil"></i> Редактировать</a>
            <a href="{% url 'mailings:clients_delete' object.pk %}" class="btn btn-danger"><i class="bi bi-trash"></i> Удалить</a>
            <a href="{% url 'mailings:clients_list' %}" class="btn btn-secondary">Назад к списку</a>
        </div>
    </div>
</div>
{% endblock %}
