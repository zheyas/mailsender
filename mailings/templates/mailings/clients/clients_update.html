{% extends "mailings/base.html" %}
{% block title %}Изменить клиента{% endblock %}
{% block content %}
<h2 class="mb-4">Изменить клиента</h2>
<form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3">
        <label class="form-label">Email</label>
        {{ form.email|as_crispy_field }}
    </div>
    <div class="mb-3">
        <label class="form-label">Ф.И.О.</label>
        {{ form.full_name|as_crispy_field }}
    </div>
    <div class="mb-3">
        <label class="form-label">Комментарий</label>
        {{ form.comment|as_crispy_field }}
    </div>
    <button type="submit" class="btn btn-primary"><i class="bi bi-pencil"></i> Сохранить</button>
    <a href="{% url 'mailings:clients_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
