{% extends "mailings/base.html" %}
{% block title %}Удалить клиента{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body text-center">
        <h2 class="text-danger"><i class="bi bi-trash"></i> Удалить клиента?</h2>
        <p>Вы уверены, что хотите удалить клиента <strong>{{ object.full_name }}</strong> ({{ object.email }})?</p>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Да, удалить</button>
            <a href="{% url 'mailings:clients_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
