
{% extends "mailings/base.html" %}
{% block title %}Главная{% endblock %}
{% block content %}
<h1 class="mb-4">Добро пожаловать в сервис рассылок!</h1>
<div class="row">
    <div class="col-md-4">
        <div class="card text-center mb-3">
            <div class="card-body">
                <h5 class="card-title">Всего рассылок</h5>
                <p class="card-text display-6">{{ total_mailings }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center mb-3">
            <div class="card-body">
                <h5 class="card-title">Активных рассылок</h5>
                <p class="card-text display-6">{{ active_mailings }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center mb-3">
            <div class="card-body">
                <h5 class="card-title">Уникальных получателей</h5>
                <p class="card-text display-6">{{ unique_clients }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
